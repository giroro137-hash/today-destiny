<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TODAY'S DESTINY - 나만의 운명 리포트</title>
  <style>
    :root {
      --bg: #090a12;
      --card: #121422;
      --card-border: rgba(212, 175, 55, 0.25);
      --gold: #f5e49b;
      --gold-bright: #ffd700;
      --gold-gradient: linear-gradient(135deg, #ffe885 0%, #c8963e 100%);
      --text: #f8fafc;
      --sub: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Apple SD Gothic Neo', sans-serif; }
    body { background: var(--bg); color: var(--text); line-height: 1.5; padding-bottom: 60px; overflow-x: hidden; }

    .hero {
      position: relative;
      text-align: center;
      padding: 40px 20px 30px;
      background: radial-gradient(circle at 50% 20%, #2b1c4e 0%, #090a12 75%);
      border-bottom: 1px solid var(--card-border);
      overflow: hidden;
    }
    .hero-card {
      max-width: 440px;
      margin: 0 auto 20px;
      border-radius: 20px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(157, 92, 255, 0.25), 0 0 15px rgba(212, 175, 55, 0.2);
      border: 1px solid var(--card-border);
      position: relative;
    }
    .hero-card img {
      width: 100%;
      height: 220px;
      object-fit: cover;
      display: block;
      filter: brightness(0.9) contrast(1.1);
    }
    .hero-card-overlay {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 15px;
      background: linear-gradient(to top, rgba(9, 10, 18, 0.95), transparent);
    }
    .badge {
      display: inline-block;
      font-size: 11px;
      letter-spacing: 2.5px;
      color: var(--gold-bright);
      text-transform: uppercase;
      font-weight: 800;
      margin-bottom: 4px;
    }
    h1 { font-size: 22px; line-height: 1.4; color: #fff; font-weight: 800; }
    .hero-sub { color: var(--sub); font-size: 13.5px; margin-top: 6px; }

    .chips { display: flex; justify-content: center; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
    .chip { font-size: 12px; padding: 5px 12px; border-radius: 20px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(212, 175, 55, 0.3); color: var(--gold); }

    .container { max-width: 460px; margin: 0 auto; padding: 0 16px; }
    .panel {
      border: 1px solid var(--card-border);
      border-radius: 24px;
      background: var(--card);
      padding: 24px;
      margin-top: -15px;
      position: relative;
      z-index: 10;
      box-shadow: 0 20px 40px rgba(0,0,0,0.6);
    }
    h2 { font-size: 18px; color: var(--gold); margin-bottom: 16px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
    h2::before { content: "✦"; color: var(--gold-bright); }

    label { display: block; color: var(--sub); font-size: 13px; margin: 14px 0 6px; font-weight: 600; }
    input, select {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid #2a2d42;
      background: #191c2e;
      color: #fff;
      font-size: 14.5px;
      outline: none;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }

    .chk { display: flex; align-items: flex-start; gap: 10px; margin-top: 20px; font-size: 12px; color: var(--sub); cursor: pointer; }
    .chk input { width: 18px; height: 18px; margin-top: 2px; accent-color: var(--gold-bright); }
    .chk a { color: var(--gold); text-decoration: underline; }

    .btn {
      width: 100%;
      margin-top: 24px;
      padding: 17px;
      border: 0;
      border-radius: 14px;
      background: var(--gold-gradient);
      font-weight: 800;
      font-size: 16.5px;
      color: #0f1015;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.35);
    }

    /* 결과 출력 영역 및 프리미엄 카드 */
    #result { margin-top: 25px; }
    .result-box {
      background: #151828;
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      margin-top: 20px;
      color: #fff;
    }
    .result-box h3 { color: var(--gold-bright); margin-bottom: 10px; font-size: 18px; }

    .premium-preview {
      margin-top: 28px;
      border: 1px solid rgba(212, 175, 55, 0.4);
      border-radius: 22px;
      background: linear-gradient(165deg, #1d1b2e 0%, #0d0e17 100%);
      overflow: hidden;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .preview-img-wrap { width: 100%; height: 190px; overflow: hidden; position: relative; }
    .preview-img-wrap img { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }
    .preview-tag { position: absolute; top: 12px; left: 12px; background: rgba(0,0,0,0.75); color: var(--gold-bright); font-size: 11px; padding: 4px 10px; border-radius: 12px; border: 1px solid var(--gold-bright); font-weight: 700; }
    .preview-body { padding: 20px; }
    .preview-title { font-size: 17.5px; color: #fff; font-weight: 700; margin-bottom: 8px; line-height: 1.4; }
    .preview-desc { font-size: 13px; color: var(--sub); line-height: 1.5; margin-bottom: 14px; }
    .preview-price-bar { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid rgba(255,255,255,0.08); padding-top: 12px; margin-top: 10px; }
    .price { font-size: 21px; color: var(--gold-bright); font-weight: 800; }
    .price-sub { font-size: 12px; color: var(--sub); }
  </style>
</head>
<body>

  <div class="hero">
    <div class="hero-card">
      <img src="https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop" alt="Cosmic Destiny">
      <div class="hero-card-overlay">
        <div class="badge">✦ TODAY'S DESTINY ✦</div>
        <h1>오늘, 당신의 운명은<br>어떤 이야기를 준비하고 있을까요?</h1>
      </div>
    </div>
    <p class="hero-sub">생년월일로 시작하는 나만의 맞춤 운명 리포트</p>
    <div class="chips">
      <span class="chip">💖 연애운</span>
      <span class="chip">💰 재물운</span>
      <span class="chip">💼 직장·학업</span>
      <span class="chip">⏳ 시간대별 흐름</span>
    </div>
  </div>

  <div class="container">
    <div class="panel">
      <h2>나의 정보 입력</h2>
      <form id="form">
        <label for="birth">생년월일</label>
        <input id="birth" type="date" required>
        
        <div class="grid">
          <div>
            <label for="calendar">달력 기준</label>
            <select id="calendar">
              <option value="solar">양력</option>
              <option value="lunar">음력</option>
            </select>
          </div>
          <div>
            <label for="time">태어난 시간</label>
            <select id="time">
              <option value="unknown">모름 (시간 모름)</option>
              <option value="rat">자시 (밤 11:30 ~ 새벽 1:29)</option>
              <option value="ox">축시 (새벽 1:30 ~ 새벽 3:29)</option>
              <option value="tiger">인시 (새벽 3:30 ~ 아침 5:29)</option>
              <option value="rabbit">묘시 (아침 5:30 ~ 오전 7:29)</option>
              <option value="dragon">진시 (오전 7:30 ~ 오전 9:29)</option>
              <option value="snake">사시 (오전 9:30 ~ 오전 11:29)</option>
              <option value="horse">오시 (낮 11:30 ~ 오후 1:29)</option>
              <option value="sheep">미시 (오후 1:30 ~ 오후 3:29)</option>
              <option value="monkey">신시 (오후 3:30 ~ 오후 5:29)</option>
              <option value="rooster">유시 (오후 5:30 ~ 저녁 7:29)</option>
              <option value="dog">술시 (저녁 7:30 ~ 밤 9:29)</option>
              <option value="pig">해시 (밤 9:30 ~ 밤 11:29)</option>
            </select>
          </div>
        </div>

        <label class="chk">
          <input type="checkbox" id="consent" required>
          <span>[필수] 만 14세 이상이며, <a href="/privacy.html" target="_blank">개인정보·이용약관</a> 동의<small style="display:block; color:#666; margin-top:2px;">입력 정보는 서버에 저장되지 않고 즉시 폐기됩니다.</small></span>
        </label>

        <button type="submit" class="btn">첫 운세 무료로 보기 ✦</button>
      </form>
    </div>

    <!-- 결과가 나타나는 공간 -->
    <div id="result"></div>

    <div class="premium-preview">
      <div class="preview-img-wrap">
        <span class="preview-tag">PREMIUM REPORT</span>
        <img src="https://images.unsplash.com/photo-1538370965046-79c0d6907d47?q=80&w=1000&auto=format&fit=crop" alt="Premium Tarot">
      </div>
      <div class="preview-body">
        <div class="preview-title">당신의 운명에는 아직 공개되지 않은 이야기가 있습니다.</div>
        <p class="preview-desc">무료 운세에서는 확인할 수 없었던 나만의 연애·재물 흐름과 앞으로 30일간의 결정적 타이밍을 세밀하게 풀어드립니다.</p>
        <div class="preview-price-bar">
          <div>
            <div class="price">2,900원</div>
            <div class="price-sub">1회 구매 (자동 결제 없음)</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('form').addEventListener('submit', function(e) {
      e.preventDefault();
      const birth = document.getElementById('birth').value;
      const calendar = document.getElementById('calendar').value;
      const time = document.getElementById('time').value;

      // 간단한 무료 운세 결과 예시 렌더링
      const resultDiv = document.getElementById('result');
      resultDiv.innerHTML = `
        <div class="result-box">
          <h3>✨ 무료 운세 풀이 결과</h3>
          <p>입력하신 생년월일(${birth})을 바탕으로 확인한 결과, 오늘의 당신은 주변의 도움과 뜻밖의 행운이 따르는 기운을 가지고 있습니다.</p>
          <p style="margin-top:10px; color:var(--sub); font-size:13px;">※ 더욱 상세한 연애운 및 재물운 분석은 아래 프리미엄 리포트를 이용해 주세요.</p>
        </div>
      `;
      resultDiv.scrollIntoView({ behavior: 'smooth' });
    });
  </script>
</body>
</html>
